<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講座の練習ページ</title>
  <style>
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #333;
      line-height: 1.8;
    }
    header {
      background: #3b82f6;
      color: #fff;
      text-align: center;
      padding: 48px 16px;
    }
    header h1 { margin: 0 0 8px; font-size: 2rem; }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    section {
      background: #fff;
      border-radius: 8px;
      padding: 16px 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    h2 { border-left: 4px solid #3b82f6; padding-left: 8px; font-size: 1.2rem; color: #1e3a8a; }
    footer { text-align: center; padding: 16px; color: #888; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>講座の練習ページ</h1>
    <p>はじめまして！自己紹介ページです。</p>
  </header>
  <main>
    <section>
      <h2>プロフィール</h2>
      <p>名前：講座の練習ページ<br>職業・所属：学習中</p>
    </section>
    <section>
      <h2>自己紹介</h2>
      <p>Webサイト作りを学び始めました。このページは講座の練習で作った1ページのサイトです。</p>
    </section>
    <section>
      <h2>趣味</h2>
      <ul>
        <li>読書</li>
        <li>散歩</li>
        <li>音楽鑑賞</li>
      </ul>
    </section>
  </main>
  <footer>&copy; 2026 講座の練習ページ</footer>
</body>
</html>
